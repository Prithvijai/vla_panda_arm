[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panda-maniskill-vla"
version = "0.1.0"
description = "A modular ManiSkill environment for Panda control and VLA experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0,<2",
  "mani-skill>=3.0.0,<4",
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
  "protobuf>=6.33.5,<8",
  "pyzmq>=26,<28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
pms-env-server = "panda_maniskill_vla.panda_env:main"
pms-image-viewer = "panda_maniskill_vla.image_viewer:main"
pms-sim-server = "panda_maniskill_vla.sim_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_maniskill_vla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
